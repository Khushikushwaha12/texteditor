<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Playfair+Display&family=Poppins&family=Roboto+Slab&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Scratchpad — Local Text Editor</title>
</head>
<body>

    <div class="app">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <span class="brand"><i class='bx bx-notepad'></i> Scratchpad</span>
                <div class="new-doc-wrap">
                    <button class="icon-btn" id="new-doc-btn" title="New document"><i class='bx bx-plus'></i></button>
                    <div class="template-menu" id="template-menu">
                        <button data-template="blank">Blank</button>
                        <button data-template="resume">Resume</button>
                        <button data-template="letter">Letter</button>
                        <button data-template="todo">To-Do List</button>
                    </div>
                </div>
            </div>
            <div class="doc-list" id="doc-list"></div>
            <div class="sidebar-bottom">
                <button class="icon-btn" id="theme-toggle" title="Toggle dark mode"><i class='bx bx-moon'></i></button>
                <span class="storage-note">Saved only in this browser</span>
            </div>
        </aside>

        <div class="container">
            <div class="toolbar" id="toolbar">
                <div class="head">
                    <button class="icon-btn mobile-only" id="sidebar-toggle" title="Documents"><i class='bx bx-menu'></i></button>
                    <input type="text" placeholder="Filename" value="Untitled" id="filename">

                    <select onchange="fileHandle(this.value); this.selectedIndex=0">
                        <option value="" selected hidden disabled>File</option>
                        <option value="new">New file</option>
                        <option value="txt">Save as .txt</option>
                        <option value="pdf">Save as .pdf</option>
                        <option value="docx">Save as .docx</option>
                    </select>

                    <select onchange="formatDoc('formatBlock', this.value);this.selectedIndex=0;">
                        <option value="" selected hidden disabled>Format</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="h4">Heading 4</option>
                        <option value="h5">Heading 5</option>
                        <option value="h6">Heading 6</option>
                        <option value="p">Paragraph</option>
                    </select>

                    <select id="font-size-select" onchange="applyFontSize(this.value); this.selectedIndex=0;">
                        <option value="" selected hidden disabled>Font size</option>
                        <option value="10px">Extra Small</option>
                        <option value="13px">Small</option>
                        <option value="16px">Regular</option>
                        <option value="19px">Medium</option>
                        <option value="24px">Large</option>
                        <option value="32px">Extra Large</option>
                        <option value="48px">Big</option>
                    </select>

                    <select id="font-name-select" onchange="applyFontName(this.value); this.selectedIndex=0;">
                        <option value="" selected hidden disabled>Font style</option>
                        <option value="Arial">Arial</option>
                        <option value="Arial Black">Arial Black</option>
                        <option value="Arial Narrow">Arial Narrow</option>
                        <option value="Bahnschrift">Bahnschrift</option>
                        <option value="Bookman Old Style">Bookman Old Style</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Cambria">Cambria</option>
                        <option value="Candara">Candara</option>
                        <option value="Century Gothic">Century Gothic</option>
                        <option value="Comic Sans MS">Comic Sans MS</option>
                        <option value="Consolas">Consolas</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Garamond">Garamond</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Impact">Impact</option>
                        <option value="Lucida Console">Lucida Console</option>
                        <option value="Palatino Linotype">Palatino Linotype</option>
                        <option value="Segoe UI">Segoe UI</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Playfair Display">Playfair Display</option>
                        <option value="Roboto Slab">Roboto Slab</option>
                        <option value="Caveat">Caveat (Handwriting)</option>
                    </select>

                    <div class="color">
                        <span>Color</span>
                        <input type="color" oninput="formatDoc('foreColor', this.value); this.value='#000000';">
                    </div>
                    <div class="color">
                        <span>Background</span>
                        <input type="color" oninput="formatDoc('hiliteColor', this.value); this.value='#000000';">
                    </div>

                    <label class="icon-btn" title="Import .txt file">
                        <i class='bx bx-import'></i>
                        <input type="file" id="import-file" accept=".txt" hidden>
                    </label>
                </div>

                <div class="btn-toolbar">
                    <button onclick="formatDoc('undo')" title="Undo"><i class='bx bx-undo'></i></button>
                    <button onclick="formatDoc('redo')" title="Redo"><i class='bx bx-redo'></i></button>
                    <button onclick="formatDoc('bold')" title="Bold (Ctrl+B)"><i class='bx bx-bold'></i></button>
                    <button onclick="formatDoc('underline')" title="Underline (Ctrl+U)"><i class='bx bx-underline'></i></button>
                    <button onclick="formatDoc('italic')" title="Italic (Ctrl+I)"><i class='bx bx-italic'></i></button>
                    <button onclick="formatDoc('strikethrough')" title="Strikethrough"><i class='bx bx-strikethrough'></i></button>
                    <button onclick="formatDoc('justifyLeft')" title="Align left"><i class='bx bx-align-left'></i></button>
                    <button onclick="formatDoc('justifyCenter')" title="Align center"><i class='bx bx-align-middle'></i></button>
                    <button onclick="formatDoc('justifyRight')" title="Align right"><i class='bx bx-align-right'></i></button>
                    <button onclick="formatDoc('justifyFull')" title="Justify"><i class='bx bx-align-justify'></i></button>
                    <button onclick="formatDoc('insertOrderedList')" title="Numbered list"><i class='bx bx-list-ol'></i></button>
                    <button onclick="formatDoc('insertUnorderedList')" title="Bulleted list"><i class='bx bx-list-ul'></i></button>
                    <button onclick="addLink()" title="Insert link"><i class='bx bx-link'></i></button>
                    <button onclick="formatDoc('unlink')" title="Remove link"><i class='bx bx-unlink'></i></button>
                    <button id="show-code" data-active="false" title="View HTML source">&lt;/&gt;</button>

                    <span class="divider"></span>

                    <button id="search-btn" title="Search (Ctrl+F)"><i class='bx bx-search'></i></button>
                    <button id="print-btn" title="Print"><i class='bx bx-printer'></i></button>
                    <button id="read-aloud-btn" title="Read aloud"><i class='bx bx-volume-full'></i></button>
                    <button id="voice-btn" title="Voice typing (speech-to-text)"><i class='bx bx-microphone'></i></button>
                    <button id="grammar-btn" title="Check spelling & grammar"><i class='bx bx-check-shield'></i></button>
                    <button id="focus-btn" title="Focus mode"><i class='bx bx-expand'></i></button>

                    <span class="save-indicator" id="save-indicator">Saved</span>
                </div>

                <div class="search-bar" id="search-bar">
                    <i class='bx bx-search'></i>
                    <input type="text" id="search-input" placeholder="Find in document…">
                    <button id="search-prev" title="Previous"><i class='bx bx-chevron-up'></i></button>
                    <button id="search-next" title="Next"><i class='bx bx-chevron-down'></i></button>
                    <button id="search-close" title="Close"><i class='bx bx-x'></i></button>
                </div>

                <div class="grammar-panel" id="grammar-panel">
                    <div class="grammar-panel-header">
                        <span><i class='bx bx-check-shield'></i> Spelling &amp; Grammar Suggestions</span>
                        <button id="grammar-close" title="Close"><i class='bx bx-x'></i></button>
                    </div>
                    <div class="grammar-list" id="grammar-list"></div>
                </div>
            </div>

            <div id="content" contenteditable="true" spellcheck="true">
                Start typing…
            </div>

            <div class="status-bar">
                <span id="word-count">0 words</span>
                <span id="char-count">0 characters</span>
                <span id="read-time">0 min read</span>
                <span id="voice-status"></span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="scripts.js"></script>

</body>
</html>
